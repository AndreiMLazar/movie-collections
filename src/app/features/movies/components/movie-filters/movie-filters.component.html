<div class="movie-filters">
  <div class="movie-filters__sort">
    <label class="movie-filters__sort-label" for="movie-sort">Sort by</label>
    <select
      id="movie-sort"
      class="movie-filters__sort-select"
      [ngModel]="pendingSortBy()"
      (ngModelChange)="onSortChange($event)"
    >
      @for (option of sortOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>

  <div class="movie-filters__genres">
    <span class="movie-filters__genres-label">Genres</span>
    <div class="movie-filters__chips" role="group" aria-label="Filter by genre">
      @for (genre of genreEntries(); track genre.id) {
        <button
          type="button"
          class="movie-filters__chip"
          [class.movie-filters__chip--active]="isGenreSelected(genre.id)"
          [attr.aria-pressed]="isGenreSelected(genre.id)"
          (click)="toggleGenre(genre.id)"
        >
          {{ genre.name }}
        </button>
      }
    </div>
  </div>

  @if (hasActiveFilters()) {
    <button type="button" class="movie-filters__clear" (click)="clearFilters()">
      Clear filters
    </button>
  }
</div>
